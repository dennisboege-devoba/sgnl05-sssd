---
# sssd talks to the LDAP container from test/ldap, named ldap on the docker
# network "kitchen", and trusts the CA it publishes in the volume ldap-ca, see README.md.
driver:
  name: "docker"
  use_sudo: false
  memory: "2G"
  privileged: true
  run_command: "/lib/systemd/systemd"
  volume:
    - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
    - "ldap-ca:/etc/ldap-ca:ro"
  run_options:
    network: "kitchen"
    cgroupns: "host"

transport:
  name: "docker"

provisioner:
  name: "puppet_apply"
  manifest: "site.pp"
  # kitchen-puppet installs the package "puppet-agent", which is Puppet 7 on Debian,
  # so openvox-agent is installed by the driver instead
  require_puppet_collections: false
  require_puppet_repo: false
  puppet_binary: "/opt/puppetlabs/bin/puppet"
  # without detailed exit codes a failed puppet run still counts as converged
  puppet_detailed_exitcodes: true
  puppet_whitelist_exit_code: [0, 2]
  ignored_paths_from_root:
    - "spec"
    - "vendor"
  ignore_spec_fixtures: true
  spec_files_path: "test/integration/default/serverspec"

platforms:
<% { 'debian-12' => 'debian12', 'debian-13' => 'debian13', 'ubuntu-24.04' => 'ubuntu24.04' }.each_pair do |platform, release| %>
  - name: "<%= platform %>"
    driver:
      provision_command:
        - apt-get install -y systemd systemd-sysv wget ca-certificates ruby ruby-bundler pamtester login
        # Debian 13 mounts a tmpfs on /tmp, which hides the files kitchen copies there
        - systemctl mask tmp.mount
        - wget -q -O /tmp/openvox8-release.deb https://apt.voxpupuli.org/openvox8-release-<%= release %>.deb
        - dpkg -i /tmp/openvox8-release.deb && apt-get update && apt-get install -y openvox-agent
<% end %>
  - name: "rocky-9"
    driver:
      image: "rockylinux/rockylinux:9"
      platform: "rhel"
      run_command: "/usr/sbin/init"
      provision_command:
        - dnf install -y epel-release
        - dnf install -y systemd ruby rubygem-bundler pamtester util-linux
        - systemctl mask tmp.mount
        - rpm -Uvh https://yum.voxpupuli.org/openvox8-release-el-9.noarch.rpm && dnf install -y openvox-agent
  - name: "sles-15"
    driver:
      image: "registry.suse.com/bci/bci-init:15.7"
      platform: "sles"
      # OpenVox only ships x86_64 packages for SLES
      docker_platform: "linux/amd64"
      run_command: "/usr/lib/systemd/systemd"
      provision_command:
        - zypper install -y ruby ruby2.5-rubygem-bundler sssd-tools util-linux
        - systemctl mask tmp.mount
        # systemd-tmpfiles-setup fails in docker at the credentials step, so /run/sssd would be missing
        - mkdir -p /etc/systemd/system/systemd-tmpfiles-setup.service.d
        - printf '[Service]\nImportCredential=\n' > /etc/systemd/system/systemd-tmpfiles-setup.service.d/docker.conf
        - rpm -Uvh https://yum.voxpupuli.org/openvox8-release-sles-15.noarch.rpm
        - zypper --gpg-auto-import-keys install -y openvox-agent

# without patterns kitchen-verifier-serverspec runs no specs at all and still passes
verifier:
  name: serverspec
  patterns:
    - "/etc/puppet/spec/localhost/*_spec.rb"
  extra_flags: "-I /etc/puppet/spec"

suites:
  - name: "default"
